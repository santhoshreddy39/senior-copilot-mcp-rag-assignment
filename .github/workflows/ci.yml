name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install ruff

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Unit tests
        run: pytest tests/unit rag/tests -q

      - name: Integration tests (MCP server + client, simulator, orchestration)
        run: pytest tests/integration -q

      - name: End-to-end scenario test
        run: pytest tests/e2e -q

      - name: Coverage report
        run: |
          pytest --cov=apps --cov=connectors --cov=rag --cov=mcp-servers/alarm-management \
            --cov-report=term-missing --cov-report=xml -q

      - name: Dependency vulnerability check
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt || true  # non-blocking: report, don't fail the build on advisories

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build validation
        run: docker build -t alarm-copilot:ci .
