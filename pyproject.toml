[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".venv", "rag/index"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]  # long lines are common in docstrings/log format strings; kept readable over strict wrap

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401"]
"rag/tests/**" = ["F401"]
# box(...) calls draw as a side effect; the returned coordinates are kept
# in named locals only for readability/future arrow-wiring, not reused.
"scripts/generate_architecture_diagram.py" = ["F841"]
